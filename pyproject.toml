[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-procurement-intelligence"
version = "0.1.0"
description = "Spend analytics, anomaly detection, supplier risk and spend classification on French public procurement data, with LLM explanations validated by the user."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Thierry Daconceição Alvares" }]
dependencies = [
    "duckdb==1.5.6",
    "google-genai==2.31.0",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
# The Streamlit application.
app = ["plotly==7.1.0", "streamlit==1.66.0"]
# The pipeline that builds the marts and models from the data snapshot.
build = ["lightgbm==4.7.0"]
dev = ["jsonschema==4.26.0", "playwright==1.64.0", "pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
